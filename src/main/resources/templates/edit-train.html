
<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Edit Train | Admin</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{

            background:#f5f7fb;

        }

        .navbar{

            box-shadow:0 2px 12px rgba(0,0,0,.15);

        }

        .hero{

            margin-top:35px;

            padding:45px;

            border-radius:20px;

            background:linear-gradient(135deg,#212529,#495057);

            color:white;

        }

        .form-card{

            margin-top:-30px;

            border:none;

            border-radius:20px;

        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="/admin/dashboard">

            Train Reservation System - Admin

        </a>

        <div class="ms-auto">

            <a href="/admin/trains"
               class="btn btn-light me-2">

                Back

            </a>

            <form th:action="@{/logout}"
                  method="post"
                  style="display:inline;">

                <button class="btn btn-danger">

                    <i class="bi bi-box-arrow-right"></i>

                    Logout

                </button>

            </form>

        </div>

    </div>

</nav>

<div class="container">

    <div class="hero shadow">

        <h1>

            Edit Train

        </h1>

        <p class="lead mt-3">

            Update train details, fares, timings and seat availability.

        </p>

    </div>

    <div class="card shadow form-card">

        <div class="card-body p-4">

            <h3 class="mb-4">

                <i class="bi bi-pencil-square"></i>

                Train Information

            </h3>

            <form th:action="@{/admin/trains/update}"
                  th:object="${train}"
                  method="post">

                <input type="hidden"
                       th:field="*{id}">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">

                            Train Number

                        </label>

                        <input type="text"
                               th:field="*{trainNo}"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">

                            Train Name

                        </label>

                        <input type="text"
                               th:field="*{trainName}"
                               class="form-control"
                               required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">

                            Train Type

                        </label>

                        <select th:field="*{trainType}"
                                class="form-select">

                            <option value="Passenger">Passenger</option>
                            <option value="Express">Express</option>
                            <option value="Superfast">Superfast</option>
                            <option value="Rajdhani">Rajdhani</option>
                            <option value="Shatabdi">Shatabdi</option>

                        </select>

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label fw-semibold">

                            Base Fare (₹)

                        </label>

                        <input type="number"
                               min="0"
                               th:field="*{baseFare}"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label fw-semibold">

                            Fare / Station (₹)

                        </label>

                        <input type="number"
                               min="0"
                               th:field="*{farePerStation}"
                               class="form-control"
                               required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">

                            Source Station

                        </label>

                        <input type="text"
                               th:field="*{sourceStation}"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">

                            Destination Station

                        </label>

                        <input type="text"
                               th:field="*{destinationStation}"
                               class="form-control"
                               required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">

                            Departure Time

                        </label>

                        <input type="text"
                               th:field="*{departureTime}"
                               class="form-control"
                               placeholder="16:00"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">

                            Arrival Time

                        </label>

                        <input type="text"
                               th:field="*{arrivalTime}"
                               class="form-control"
                               placeholder="10:00"
                               required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">

                            Total Seats

                        </label>

                        <input type="number"
                               th:field="*{totalSeats}"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label fw-semibold">

                            Available Seats

                        </label>

                        <input type="number"
                               th:field="*{availableSeats}"
                               class="form-control"
                               required>

                    </div>

                </div>

                <div class="alert alert-warning">

                    <i class="bi bi-exclamation-triangle-fill"></i>

                    Updating total or available seats may affect future bookings. Verify all changes before saving.

                </div>

                <div class="d-grid">

                    <button type="submit"
                            class="btn btn-primary btn-lg">

                        <i class="bi bi-floppy-fill"></i>

                        Update Train

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<footer class="bg-dark text-white mt-5">

    <div class="container py-4 text-center">

        © 2026 Train Reservation System | Administrator Panel

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>


<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Manage Routes | Admin</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{

            background:#f5f7fb;

        }

        .navbar{

            box-shadow:0 2px 12px rgba(0,0,0,.15);

        }

        .hero{

            margin-top:35px;

            background:linear-gradient(135deg,#212529,#495057);

            color:white;

            padding:45px;

            border-radius:20px;

        }

        .table-card{

            margin-top:-30px;

            border:none;

            border-radius:20px;

        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="/admin/dashboard">

            Train Reservation System - Admin

        </a>

        <div class="ms-auto">

            <a href="/admin/trains"
               class="btn btn-light me-2">

                Manage Trains

            </a>

            <form th:action="@{/logout}"
                  method="post"
                  style="display:inline;">

                <button class="btn btn-danger">

                    <i class="bi bi-box-arrow-right"></i>

                    Logout

                </button>

            </form>

        </div>

    </div>

</nav>

<div class="container">

    <div class="hero shadow">

        <h1>

            Route Management

        </h1>

        <p class="lead mt-3">

            Configure stations and timings for

            <strong th:text="${train.trainName}"></strong>

        </p>

    </div>

    <div class="card shadow table-card">

        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">

            <h4 class="mb-0">

                Route Stations

            </h4>

            <a th:href="@{/admin/trains/{id}/routes/add(id=${train.id})}"
               class="btn btn-success">

                <i class="bi bi-plus-circle"></i>

                Add Station

            </a>

        </div>

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-dark">

                    <tr>

                        <th>Order</th>

                        <th>Station Name</th>

                        <th>Arrival Time</th>

                        <th>Departure Time</th>

                        <th>Action</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="route : ${routes}">

                        <td>

                            <span class="badge bg-primary fs-6"
                                  th:text="${route.stationOrder}">
                            </span>

                        </td>

                        <td class="fw-semibold"
                            th:text="${route.stationName}">
                        </td>

                        <td th:text="${route.arrivalTime}">
                        </td>

                        <td th:text="${route.departureTime}">
                        </td>

                        <td>

                            <a th:href="@{/admin/routes/delete/{id}(id=${route.id})}"
                               class="btn btn-danger btn-sm"

                               onclick="return confirm('Delete this station from the route?')">

                                <i class="bi bi-trash"></i>

                                Delete

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

        <div class="card-footer bg-light text-end">

            <a href="/admin/trains"
               class="btn btn-secondary">

                <i class="bi bi-arrow-left"></i>

                Back to Trains

            </a>

        </div>

    </div>

</div>

<footer class="bg-dark text-white mt-5">

    <div class="container py-4 text-center">

        © 2026 Train Reservation System | Administrator Panel

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

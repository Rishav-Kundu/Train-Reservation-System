<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Manage Users | Admin</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{

            background:#f5f7fb;

        }

        .navbar{

            box-shadow:0 2px 12px rgba(0,0,0,.15);

        }

        .hero{

            margin-top:35px;

            padding:45px;

            border-radius:20px;

            background:linear-gradient(135deg,#212529,#495057);

            color:white;

        }

        .table-card{

            margin-top:-30px;

            border:none;

            border-radius:20px;

        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="/admin/dashboard">

            Train Reservation System - Admin

        </a>

        <div class="ms-auto">

            <a href="/admin/dashboard"
               class="btn btn-light me-2">

                Dashboard

            </a>

            <form th:action="@{/logout}"
                  method="post"
                  style="display:inline;">

                <button class="btn btn-danger">

                    <i class="bi bi-box-arrow-right"></i>

                    Logout

                </button>

            </form>

        </div>

    </div>

</nav>

<div class="container">

    <div class="hero shadow">

        <h1>

            User Management

        </h1>

        <p class="lead mt-3">

            View all registered users and their account information.

        </p>

    </div>

    <div class="card shadow table-card">

        <div class="card-header bg-primary text-white">

            <h4 class="mb-0">

                Registered Users

            </h4>

        </div>

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Email Address</th>

                        <th>Phone Number</th>

                        <th>Role</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="user : ${users}">

                        <td class="fw-semibold"
                            th:text="${user.id}">
                        </td>

                        <td th:text="${user.name}">
                        </td>

                        <td th:text="${user.email}">
                        </td>

                        <td th:text="${user.phone}">
                        </td>

                        <td>

                            <span
                                    th:if="${user.role == 'ROLE_ADMIN'}"
                                    class="badge bg-danger">

                                Administrator

                            </span>

                            <span
                                    th:if="${user.role == 'ROLE_USER'}"
                                    class="badge bg-success">

                                User

                            </span>

                            <span
                                    th:if="${user.role != 'ROLE_ADMIN' and user.role != 'ROLE_USER'}"
                                    class="badge bg-secondary"
                                    th:text="${user.role}">

                            </span>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<footer class="bg-dark text-white mt-5">

    <div class="container py-4 text-center">

        © 2026 Train Reservation System | Administrator Panel

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

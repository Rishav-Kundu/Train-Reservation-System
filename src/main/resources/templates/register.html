
<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Create Account | Train Reservation System</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{

            min-height:100vh;

            background:linear-gradient(135deg,#0d6efd,#4f8df7);

            display:flex;

            align-items:center;

        }

        .register-card{

            border:none;

            border-radius:20px;

        }

        .logo-icon{

            font-size:55px;

            color:#0d6efd;

        }

    </style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8">

            <div class="card shadow-lg register-card">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <i class="bi bi-train-front-fill logo-icon"></i>

                        <h2 class="mt-3 fw-bold">

                            Train Reservation System

                        </h2>

                        <p class="text-muted">

                            Create your account to start booking tickets

                        </p>

                    </div>

                    <form th:action="@{/register}"
                          th:object="${user}"
                          method="post">

                        <div class="mb-3">

                            <label class="form-label fw-semibold">

                                Full Name

                            </label>

                            <input type="text"
                                   th:field="*{name}"
                                   class="form-control form-control-lg"
                                   placeholder="Enter your full name"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-semibold">

                                Email Address

                            </label>

                            <input type="email"
                                   th:field="*{email}"
                                   class="form-control form-control-lg"
                                   placeholder="Enter your email"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-semibold">

                                Phone Number

                            </label>

                            <input type="text"
                                   th:field="*{phone}"
                                   class="form-control form-control-lg"
                                   placeholder="Enter your phone number"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                Password

                            </label>

                            <input type="password"
                                   th:field="*{password}"
                                   class="form-control form-control-lg"
                                   placeholder="Create a password"
                                   required>

                        </div>

                        <div class="d-grid mb-4">

                            <button type="submit"
                                    class="btn btn-primary btn-lg">

                                <i class="bi bi-person-plus-fill"></i>

                                Create Account

                            </button>

                        </div>

                    </form>

                    <div class="d-flex justify-content-between">

                        <a th:href="@{/}"
                           class="btn btn-outline-secondary">

                            <i class="bi bi-house-door-fill"></i>

                            Home

                        </a>

                        <a th:href="@{/login}"
                           class="btn btn-success">

                            <i class="bi bi-box-arrow-in-right"></i>

                            Login

                        </a>

                    </div>

                </div>

            </div>

            <div class="text-center text-white mt-4">

                © 2026 Train Reservation System

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

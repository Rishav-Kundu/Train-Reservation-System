<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Cancel Ticket | Train Reservation System</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{

            background:#f5f7fb;

        }

        .navbar{

            box-shadow:0 2px 12px rgba(0,0,0,.15);

        }

        .hero{

            margin-top:35px;

            background:linear-gradient(135deg,#dc3545,#ff6b6b);

            color:white;

            padding:45px;

            border-radius:20px;

        }

        .search-card{

            margin-top:-30px;

            border:none;

            border-radius:20px;

        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="/dashboard">

            Train Reservation System

        </a>

        <div class="ms-auto">

            <a href="/dashboard"
               class="btn btn-light me-2">

                Dashboard

            </a>

            <form th:action="@{/logout}"
                  method="post"
                  style="display:inline;">

                <button class="btn btn-danger">

                    <i class="bi bi-box-arrow-right"></i>

                    Logout

                </button>

            </form>

        </div>

    </div>

</nav>

<div class="container">

    <div class="hero shadow">

        <h1>

            Cancel Reservation

        </h1>

        <p class="lead mt-3">

            Search your booking using the PNR number and cancel your reservation securely.

        </p>

    </div>

    <div class="card shadow search-card">

        <div class="card-body p-4">

            <h3 class="mb-4">

                <i class="bi bi-search"></i>

                Search by PNR

            </h3>

            <p class="text-muted">

                Enter the PNR of your booking to view reservation details before cancellation.

            </p>

            <div th:if="${error}"
                 class="alert alert-danger alert-dismissible fade show"
                 role="alert">

                <i class="bi bi-exclamation-triangle-fill"></i>

                <span th:text="${error}"></span>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">

                </button>

            </div>

            <form th:action="@{/cancel-ticket/search}"
                  method="post">

                <div class="mb-4">

                    <label class="form-label fw-semibold">

                        PNR Number

                    </label>

                    <input type="text"
                           name="pnr"
                           class="form-control form-control-lg"
                           placeholder="Enter your PNR number"
                           required>

                </div>

                <div class="d-grid">

                    <button type="submit"
                            class="btn btn-danger btn-lg">

                        <i class="bi bi-search"></i>

                        Search Reservation

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<footer class="bg-dark text-white mt-5">

    <div class="container py-4 text-center">

        © 2026 Train Reservation System

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

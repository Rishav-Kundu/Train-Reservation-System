<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Route Station</title>

```
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
```

</head>
<body>

<div class="container mt-5">

```
<div class="card shadow">

    <div class="card-header">
        <h3>Add Station</h3>
    </div>

    <div class="card-body">

        <form th:action="@{/admin/trains/{id}/routes/add(id=${train.id})}"
              th:object="${route}"
              method="post">

            <div class="mb-3">
                <label>Station Order</label>
                <input type="number"
                       min="1"
                       max="6"
                       th:field="*{stationOrder}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Station Name</label>
                <input type="text"
                       th:field="*{stationName}"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Arrival Time</label>
                <input type="time"
                       th:field="*{arrivalTime}"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label>Departure Time</label>
                <input type="time"
                       th:field="*{departureTime}"
                       class="form-control">
            </div>

            <button class="btn btn-success">
                Save Station
            </button>

        </form>

    </div>

</div>
```

</div>

</body>
</html>
